name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s _support/tests -v
      - run: python _support/tools/validate.py
      # Default-branch pushes are refreshed by the separate writer workflow.
      - if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: python _support/tools/catalog.py --check
      - run: git diff --check
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python _support/tests/integration.py --engine docker --versions ${{ matrix.pg }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-${{ matrix.pg }}-results
          path: test-results/
  replication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python _support/tests/replication.py --engine docker --version 18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-replication-results
          path: test-results/replication.json
