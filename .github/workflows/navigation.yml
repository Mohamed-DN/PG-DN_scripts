name: Refresh navigation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: navigation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/catalog.py
      - run: python tools/catalog.py --check
      - name: Commit generated navigation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md catalog.json docs/CATALOG.md
          find scripts -name README.md -print0 | xargs -0 -r git add --
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh generated navigation'
            git push origin HEAD:main
          fi
